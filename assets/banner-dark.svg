<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sahil Zaini — Founder, Zaini Developers">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1210"/><stop offset="1" stop-color="#0f1d18"/></linearGradient>
    <pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1c2a24" stroke-width="1"/></pattern>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .cur { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .bar { animation: grow 2.4s ease-out both; transform-origin: bottom; transform-box: fill-box; }
      @keyframes grow { from { transform: scaleY(0.05); } to { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { .cur, .bar { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#g)"/>
  <rect width="1200" height="300" rx="18" fill="url(#p)" opacity=".55"/>
  <text x="64" y="92" class="m" font-size="18" fill="#4fd1a1">&gt; whoami</text>
  <text x="64" y="152" class="t" font-size="54" font-weight="700" fill="#e8efeb">Sahil Zaini</text>
  <text x="64" y="196" class="t" font-size="22" fill="#8fa39a">Founder, Zaini Developers · ERP, POS &amp; SaaS for the UAE and India</text>
  <text x="64" y="244" class="m" font-size="17" fill="#4fd1a1">&gt; building pint-ae — open-source UAE e-invoicing<tspan class="cur">_</tspan></text>
